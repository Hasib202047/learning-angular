<app-header-component></app-header-component>

<main>
  <ul id="users">
    @for (user of users; track user.id){
      <li>
        <app-user [user]="user" [selectUser] = "user.id === selectedId"
                  (selected)="onSelectUser($event)"
        />
      </li>
    }
  </ul>
  @if (selectedUserName){
    <app-tasks [name]="selectedUserName" [id]="selectedId"/>
  } @else {
    <p id="fallback"> select a user to see their task</p>
  }
</main>
