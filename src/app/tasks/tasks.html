@if (isAddingTask)
{
  <app-new-task [userId]="id" (cancel)="onCancelAddTask()"/>
}
<section id="tasks">
  <header>
    <h2>{{print()}}'s Tasks</h2>
    <menu>
      <button (click)="onStartAddTask()">Add Tasks</button>
    </menu>
  </header>

  <ul>
    @for (t of userTasks();track t.id){
      <li>
        <app-task [task]="t" (selectedTask)="onCompletedTask($event)"/>
      </li>
    }
  </ul>
</section>
