<app-header-component></app-header-component>

<main>
  <ul id="users">
    @for (user of users; track user.id){
      <li>
        <app-user [user]="user"
                  (selected)="onSelectUser($event)"
        />
      </li>
    }
  </ul>
  @if (selectedUserName){
    <app-task [name]="selectedUserName"/>
  } @else {
    <p id="fallback"> select a user to see their task</p>
  }
</main>
